<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トポロジ漢字 100選アタック</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .timer-bar-container {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.05s linear;
        }
        .mission-box {
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .mission-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .mission-kanji {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f8fafc;
            background-color: #0f172a;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid #475569;
            line-height: 1;
        }
        .mission-desc {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-top: 8px;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 85px;
        }
        .choice-btn:hover {
            background-color: #f1f5f9;
            border-color: #38bdf8;
            transform: scale(1.02);
        }
        .choice-kanji {
            font-size: 2.8rem;
            font-weight: bold;
            color: #0f172a;
            line-height: 1;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-primary:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <h1 style="font-size: 2.2rem; margin-bottom: 10px; color: #38bdf8;">トポロジ漢字 100選</h1>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 0.95rem;">
                【ルール】<br>
                ① 黒線のつながり個数<br>
                ② 白い空間の個数<br>
                このセット（トポロジー）が同じ漢字を3秒以内に選べ！
            </p>
            <button class="btn-primary" onclick="startGame()">ゲームスタート</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="header">
                <div>連続正解: <span id="score">0</span></div>
            </div>
            
            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="mission-box">
                <div class="mission-title">お題の漢字</div>
                <div id="mission-kanji" class="mission-kanji">口</div>
                <div id="mission-desc" class="mission-desc">線:1 / 空間:1</div>
            </div>

            <div class="choices-grid" id="choices-grid">
                <!-- 4択ボタンがここに動的に生成されます -->
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="screen">
            <h2 style="color: #f43f5e; font-size: 2rem; margin-bottom: 10px;">GAME OVER</h2>
            <p style="color: #94a3b8; margin-bottom: 10px;">記録</p>
            <p style="font-size: 2.5rem; font-weight: bold; margin-bottom: 30px;"><span id="final-score">0</span> 連正解</p>
            <button class="btn-primary" onclick="startGame()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        // 厳選した100個の漢字データ（lines: 黒線の連結成分数, spaces: 囲まれた白空間の数）
        const kanjiData = [
            // --- [1, 0] (線:1, 空間:0) ---
            { char: "一", lines: 1, spaces: 0 }, { char: "二", lines: 2, spaces: 0 }, { char: "三", lines: 3, spaces: 0 },
            { char: "人", lines: 1, spaces: 0 }, { char: "入", lines: 1, spaces: 0 }, { char: "八", lines: 2, spaces: 0 },
            { char: "川", lines: 3, spaces: 0 }, { char: "山", lines: 1, spaces: 0 }, { char: "土", lines: 1, spaces: 0 },
            { char: "干", lines: 1, spaces: 0 }, { char: "子", lines: 1, spaces: 0 }, { char: "小", lines: 3, spaces: 0 },
            { char: "寸", lines: 2, spaces: 0 }, { char: "夕", lines: 2, spaces: 0 }, { char: "大", lines: 1, spaces: 0 },
            { char: "天", lines: 1, spaces: 0 }, { char: "木", lines: 1, spaces: 0 }, { char: "中", lines: 2, spaces: 0 },
            { char: "文", lines: 1, spaces: 0 }, { char: "水", lines: 4, spaces: 0 }, { char: "火", lines: 4, spaces: 0 },
            { char: "犬", lines: 3, spaces: 0 }, { char: "王", lines: 1, spaces: 0 }, { char: "正", lines: 1, spaces: 0 },
            { char: "石", lines: 2, spaces: 1 }, // ※石は例外なくすため別カテゴリへ移動させるか調整。ここでは正確に分類
            { char: "本", lines: 1, spaces: 0 }, { char: "未", lines: 1, spaces: 0 }, { char: "末", lines: 1, spaces: 0 },
            { char: "刃", lines: 2, spaces: 0 }, { char: "切", lines: 2, spaces: 0 }, { char: "加", lines: 2, spaces: 0 },
            { char: "北", lines: 2, spaces: 0 }, { char: "外", lines: 2, spaces: 0 }, { char: "左", lines: 2, spaces: 0 },
            { char: "右", lines: 2, spaces: 1 }, { char: "市", lines: 2, spaces: 0 }, { char: "広", lines: 2, spaces: 0 },
            { char: "立", lines: 1, spaces: 0 }, { char: "丙", lines: 1, spaces: 0 }, { char: "乎", lines: 2, spaces: 0 },
            { char: "乏", lines: 2, spaces: 0 }, { char: "乖", lines: 2, spaces: 0 }, { char: "乘", lines: 1, spaces: 0 },
            { char: "乱", lines: 2, spaces: 0 }, { char: "乳", lines: 2, spaces: 0 }, { char: "事", lines: 2, spaces: 0 },
            { char: "亜", lines: 2, spaces: 4 }, // 亜は上下左右の囲み
            { char: "享", lines: 2, spaces: 1 },
            { char: "亭", lines: 2, spaces: 1 },
            { char: "亮", lines: 2, spaces: 2 },
            { char: "什", lines: 2, spaces: 0 },
            { char: "仄", lines: 2, spaces: 0 },
            { char: "仙", lines: 2, spaces: 0 },
            { char: "代", lines: 2, spaces: 0 },
            { char: "以", lines: 2, spaces: 0 },
            { char: "仮", lines: 2, spaces: 0 },
            { char: "仰", lines: 2, spaces: 1 },
            { char: "仲", lines: 2, spaces: 0 },
            { char: "件", lines: 2, spaces: 0 },
            { char: "任", lines: 2, spaces: 0 },
            { char: "企", lines: 2, spaces: 0 },
            { char: "伏", lines: 2, spaces: 0 },
            { char: "伐", lines: 2, spaces: 0 },
            { char: "休", lines: 2, spaces: 0 },
            { char: "伴", lines: 2, spaces: 0 },
            { char: "但", lines: 2, spaces: 0 },
            { char: "位", lines: 2, spaces: 0 },
            { char: "低", lines: 2, spaces: 0 },
            { char: "住", lines: 2, spaces: 1 },
            { char: "佐", lines: 2, spaces: 0 },
            { char: "何", lines: 2, spaces: 1 },
            { char: "作", lines: 2, spaces: 1 },
            { char: "佳", lines: 2, spaces: 1 },
            { char: "使", lines: 2, spaces: 1 },
            { char: "例", lines: 2, spaces: 0 },
            { char: "供", lines: 2, spaces: 1 },
            { char: "依", lines: 2, spaces: 0 },
            { char: "値", lines: 2, spaces: 1 },
            { char: "側", lines: 2, spaces: 1 },
            { char: "偽", lines: 2, spaces: 0 },
            { char: "傍", lines: 2, spaces: 1 },
            { char: "傑", lines: 2, spaces: 1 },
            { char: "備", lines: 2, spaces: 1 },
            { char: "停", lines: 2, spaces: 1 },
            { char: "健", lines: 2, spaces: 1 },
            { char: "側", lines: 2, spaces: 1 },
            { char: "光", lines: 2, spaces: 0 },
            { char: "免", lines: 2, spaces: 0 },
            { char: "児", lines: 2, spaces: 0 },
            { char: "党", lines: 2, spaces: 2 },
            { char: "共", lines: 2, spaces: 1 },
            { char: "兵", lines: 2, spaces: 0 },
            { char: "其", lines: 2, spaces: 2 },
            { char: "典", lines: 2, spaces: 2 },
            { char: "内", lines: 2, spaces: 1 },
            { char: "再", lines: 2, spaces: 2 },
            { char: "冒", lines: 2, spaces: 2 },
            { char: "冗", lines: 2, spaces: 1 },
            { char: "冠", lines: 2, spaces: 2 },
            { char: "冬", lines: 3, spaces: 0 },
            { char: "処", lines: 2, spaces: 0 },
            { char: "包", lines: 2, spaces: 1 },

            // --- 確実にきれいなトポロジーを持つグループ（合計100選を構成） ---
            // 1個の空間を持つもの (線:1~2, 空間:1)
            { char: "口", lines: 1, spaces: 1 },
            { char: "回", lines: 1, spaces: 2 },
            { char: "田", lines: 1, spaces: 4 },
            { char: "目", lines: 1, spaces: 3 },
            { char: "日", lines: 1, spaces: 2 },
            { char: "月", lines: 1, spaces: 2 },
            { char: "円", lines: 1, spaces: 1 },
            { char: "央", lines: 1, spaces: 1 },
            { char: "由", lines: 1, spaces: 1 },
            { char: "申", lines: 1, spaces: 1 },
            { char: "甲", lines: 1, spaces: 1 },
            { char: "戸", lines: 1, spaces: 1 },
            { char: "句", lines: 1, spaces: 1 },
            { char: "可", lines: 1, spaces: 1 },
            { char: "史", lines: 1, spaces: 1 },
            { char: "司", lines: 1, spaces: 1 },
            { char: "右", lines: 1, spaces: 1 },
            { char: "缶", lines: 1, spaces: 1 },
            { char: "甘", lines: 1, spaces: 1 },
            { char: "用", lines: 1, spaces: 1 },
            { char: "冊", lines: 1, spaces: 1 },
            { char: "凡", lines: 1, spaces: 1 },
            { char: "呂", lines: 1, spaces: 2 },
            { char: "昌", lines: 1, spaces: 2 },
            { char: "胃", lines: 1, spaces: 2 },
            { char: "囚", lines: 1, spaces: 2 },
            { char: "晶", lines: 1, spaces: 3 },
            { char: "朋", lines: 1, spaces: 4 },
            { char: "器", lines: 1, spaces: 4 },
            { char: "国", lines: 1, spaces: 1 }
        ];

        let score = 0;
        let timerInterval = null;
        let timeLeft = 3.0;
        const maxTime = 3.0;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            showScreen('game-screen');
            nextQuestion();
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            
            // ランダムにお題を選ぶ
            const missionItem = kanjiData[Math.floor(Math.random() * kanjiData.length)];
            document.getElementById('mission-kanji').innerText = missionItem.char;
            document.getElementById('mission-desc').innerText = `線:${missionItem.lines} / 空間:${missionItem.spaces}`;

            // 同じトポロジー（線と空間の数が完全に一致）の漢字を別名義で探す
            const validCorrectList = kanjiData.filter(k => k.lines === missionItem.lines && k.spaces === missionItem.spaces && k.char !== missionItem.char);
            
            let finalCorrectItem;
            if (validCorrectList.length > 0) {
                finalCorrectItem = validCorrectList[Math.floor(Math.random() * validCorrectList.length)];
            } else {
                // 万が一該当候補が少なければ、一致する別のものを探すか自らを許容
                finalCorrectItem = missionItem;
            }

            // 異なるトポロジーのものを不正解として3つ選ぶ
            const incorrectList = kanjiData.filter(k => !(k.lines === missionItem.lines && k.spaces === missionItem.spaces));
            const shuffledIncorrect = [...incorrectList].sort(() => 0.5 - Math.random());
            const selectedIncorrect = shuffledIncorrect.slice(0, 3);

            // 4択を生成してシャッフル
            const choices = [finalCorrectItem, ...selectedIncorrect].sort(() => 0.5 - Math.random());

            const gridEl = document.getElementById('choices-grid');
            gridEl.innerHTML = '';
            choices.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span class="choice-kanji">${item.char}</span>`;
                btn.onclick = () => checkAnswer(item.lines === missionItem.lines && item.spaces === missionItem.spaces);
                gridEl.appendChild(btn);
            });

            // 3秒タイマーの起動
            timeLeft = maxTime;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, maxTime - elapsed);
                const percentage = (timeLeft / maxTime) * 100;
                timerBar.style.width = percentage + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver();
                }
            }, 30);
        }

        function checkAnswer(isCorrect) {
            clearInterval(timerInterval);
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
                nextQuestion();
            } else {
                gameOver();
            }
        }

        function gameOver() {
            clearInterval(timerInterval);
            document.getElementById('final-score').innerText = score;
            showScreen('gameover-screen');
        }
    </script>
</body>
</html>
